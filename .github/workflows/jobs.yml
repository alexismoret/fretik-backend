name: jobs

on:
  push:
    branches: [main]
    paths:
      - "packages/jobs/**"
      - "packages/shared/**"
      - "packages/providers/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/jobs.yml"
      - "packages/jobs/Dockerfile"
      - ".dockerignore"
  pull_request:
    paths:
      - "packages/jobs/**"
      - "packages/shared/**"
      - "packages/providers/**"
      - "bun.lock"
      - "package.json"
      - "packages/jobs/Dockerfile"

concurrency:
  group: jobs-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  CI: "true"

jobs:
  check:
    name: typecheck + lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check @fretik/shared
        run: bun run --filter '@fretik/shared' check

      - name: Check @fretik/providers
        run: bun run --filter '@fretik/providers' check

      - name: Smoke import @fretik/providers (runs setProviders → Zod validates every manifest)
        run: bun run --filter '@fretik/providers' smoke

      - name: Check @fretik/jobs
        run: bun run --filter '@fretik/jobs' check

      - name: Test @fretik/shared
        run: bun run --filter '@fretik/shared' test

  build-and-push:
    name: build + push to GHCR
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fretik-jobs
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/jobs/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=jobs
          cache-to: type=gha,mode=max,scope=jobs

  deploy:
    name: trigger Dokploy
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy deploy
        uses: benbristow/dokploy-deploy-action@0.2.2
        with:
          api_token: ${{ secrets.DOKPLOY_AUTH_TOKEN }}
          application_id: ${{ secrets.DOKPLOY_APP_ID_JOBS }}
          dokploy_url: ${{ secrets.DOKPLOY_URL }}
          service_type: application
