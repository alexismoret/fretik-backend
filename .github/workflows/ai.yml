name: ai

on:
  push:
    branches: [main]
    paths:
      - "packages/ai/**"
      - "packages/shared/**"
      - "packages/providers/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/ai.yml"
      - "packages/ai/Dockerfile"
      - ".dockerignore"
  pull_request:
    paths:
      - "packages/ai/**"
      - "packages/shared/**"
      - "packages/providers/**"
      - "bun.lock"
      - "package.json"
      - "packages/ai/Dockerfile"

concurrency:
  group: ai-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  CI: "true"

jobs:
  check:
    name: typecheck + lint + test
    # No provider key here, deliberately. The only step that used one was the
    # catalogue-drift check, and it is gone (see below). `tests/preload.ts`
    # defaults every provider variable to a dummy, so a unit test that reached
    # a real API would now fail instead of quietly spending money.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install poppler-utils (native binary node-poppler needs — mirrors the Dockerfile)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check @fretik/shared
        run: bun run --filter '@fretik/shared' check

      - name: Check @fretik/providers
        run: bun run --filter '@fretik/providers' check

      - name: Smoke import @fretik/providers (runs setProviders → Zod validates every manifest)
        run: bun run --filter '@fretik/providers' smoke

      - name: Check @fretik/ai
        run: bun run --filter '@fretik/ai' check

      - name: Test @fretik/shared
        run: bun run --filter '@fretik/shared' test

      - name: Test @fretik/ai (unit only — integration tests gated separately)
        run: bun run --filter '@fretik/ai' test

      # There is no catalogue-drift step any more, and the reason belongs here
      # rather than in a commit nobody will read.
      #
      # It diffed 22 hand-written `catalog` blocks against the live OpenRouter
      # models API. Those blocks were deleted on 2026-08-30: the nightly sync
      # writes the catalogue onto `model_live_state` and `effective.ts` derives
      # the profile from it, so the two sides it compared can no longer
      # disagree. `models:check` kept only two LIVE probes, both of which need
      # a populated database — which CI has no access to, by design.
      #
      # What replaced it is stricter, not weaker:
      #   - the DERIVATION rules are asserted over a synthetic fleet
      #     (`tests/lib/live-fleet.ts`), so they fail when the rule is wrong for
      #     every model the sync will ever discover, not when someone mistypes
      #     a list — that runs in the test step above;
      #   - drift between what the sync wrote and what the product serves is
      #     `models:admin audit`, which needs the real registry and therefore
      #     belongs to the deploy (see DEPLOY-model-engine.md), not to CI.

  build-and-push:
    name: build + push to GHCR
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fretik-ai
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/ai/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ai
          cache-to: type=gha,mode=max,scope=ai

  deploy:
    name: trigger Dokploy
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy deploy
        uses: benbristow/dokploy-deploy-action@0.2.2
        with:
          api_token: ${{ secrets.DOKPLOY_AUTH_TOKEN }}
          application_id: ${{ secrets.DOKPLOY_APP_ID_AI }}
          dokploy_url: ${{ secrets.DOKPLOY_URL }}
          service_type: application
