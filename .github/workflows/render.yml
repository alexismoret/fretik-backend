name: render

on:
  push:
    branches: [main]
    paths:
      - "packages/render/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/render.yml"
  pull_request:
    paths:
      - "packages/render/**"
      - "bun.lock"
      - "package.json"

concurrency:
  group: render-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  CI: "true"

jobs:
  check:
    name: typecheck + lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The contract's generated copy lives in the frontend repo, which is not
      # checked out here — `sync-contract --check` detects that and skips. The
      # copy is verified in fretik-app's own CI, and staleness between the two
      # is caught by the pre-push hook, where both trees exist.
      - name: Check @fretik/render
        run: bun run --filter '@fretik/render' check

      - name: Test @fretik/render
        run: bun run --filter '@fretik/render' test
