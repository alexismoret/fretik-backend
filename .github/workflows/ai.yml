name: ai

on:
  push:
    branches: [main]
    paths:
      - "packages/ai/**"
      - "packages/shared/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/ai.yml"
      - "packages/ai/Dockerfile"
      - ".dockerignore"
  pull_request:
    paths:
      - "packages/ai/**"
      - "packages/shared/**"
      - "bun.lock"
      - "package.json"
      - "packages/ai/Dockerfile"

concurrency:
  group: ai-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  CI: "true"

jobs:
  check:
    name: typecheck + lint + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check @fretik/shared
        run: bun run --filter '@fretik/shared' check

      - name: Check @fretik/ai
        run: bun run --filter '@fretik/ai' check

      - name: Test @fretik/shared
        run: bun run --filter '@fretik/shared' test

      - name: Test @fretik/ai (unit only — integration tests gated separately)
        run: bun run --filter '@fretik/ai' test

  build-and-push:
    name: build + push to GHCR
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fretik-ai
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/ai/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ai
          cache-to: type=gha,mode=max,scope=ai

  deploy:
    name: trigger Dokploy
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy deploy
        uses: benbristow/dokploy-deploy-action@0.2.2
        with:
          api_token: ${{ secrets.DOKPLOY_AUTH_TOKEN }}
          application_id: ${{ secrets.DOKPLOY_APP_ID_AI }}
          dokploy_url: ${{ secrets.DOKPLOY_URL }}
          service_type: application
