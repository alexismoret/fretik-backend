name: backend

# One workflow for the whole repo, replacing api.yml / ai.yml / jobs.yml /
# providers.yml.
#
# Those four each re-ran `check` AND `test` for `@fretik/shared` — the heaviest
# suite in the repo, three to four times per push — and none of them ran a
# single integration test, because none of them had a database. This runs the
# shared work ONCE, adds the integration job, and builds only the images whose
# code actually changed. Net minutes should go down, not up; the place to
# confirm that is Settings → Billing → Actions after a month.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  CI: "true"

jobs:
  # Which images need rebuilding. Everything downstream of `shared` or
  # `providers` is everything, so those two fan out to all three services.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      ai: ${{ steps.filter.outputs.ai }}
      jobs: ${{ steps.filter.outputs.jobs }}
    steps:
      - uses: actions/checkout@v6
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # The common paths are repeated rather than shared through a YAML
          # anchor. An anchor expands to a NESTED list here, and if this action
          # ever stopped flattening those, the filter would match nothing — a
          # change to `shared` would rebuild no image at all, deploys would
          # quietly stop, and the only symptom would be production not moving.
          # Duplication drifts towards rebuilding too much, which is a wasted
          # minute; the clever version drifts towards not deploying.
          filters: |
            api:
              - 'packages/api/**'
              - 'packages/shared/**'
              - 'packages/providers/**'
              - 'bun.lock'
              - 'package.json'
              - '.dockerignore'
              - '.github/workflows/backend.yml'
            ai:
              - 'packages/ai/**'
              - 'packages/shared/**'
              - 'packages/providers/**'
              - 'bun.lock'
              - 'package.json'
              - '.dockerignore'
              - '.github/workflows/backend.yml'
            jobs:
              - 'packages/jobs/**'
              - 'packages/shared/**'
              - 'packages/providers/**'
              - 'bun.lock'
              - 'package.json'
              - '.dockerignore'
              - '.github/workflows/backend.yml'

  check:
    name: typecheck + lint + format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile

      - name: Check every package
        run: bun run --filter '*' check

      # Runs `setProviders`, which Zod-validates every manifest at import.
      - name: Smoke import @fretik/providers
        run: bun run --filter '@fretik/providers' smoke

      # Offline: compares the journal against the schema, no connection.
      - name: Migration journal is consistent
        run: bun run --filter '@fretik/shared' db:check

  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile

      # `--filter '*' test` SKIPS a package with no `test` script, silently and
      # with exit 0. Deleting a suite would therefore look exactly like passing
      # it. A package may legitimately have no tests — it just has to say so
      # here, out loud, rather than by omission.
      - name: Every package either runs tests or is listed as having none
        run: |
          NO_TESTS="@fretik/workflows"   # Trigger.dev task entry points, thin I/O
          missing=""
          for pkg in packages/*/package.json; do
            name=$(bun -e "console.log(require('./$pkg').name)")
            if ! bun -e "process.exit(require('./$pkg').scripts?.test ? 0 : 1)"; then
              case " $NO_TESTS " in
                *" $name "*) echo "note: $name has no test suite (declared)";;
                *) missing="$missing $name";;
              esac
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::no \`test\` script, and not declared:$missing"
            exit 1
          fi

      # Hermetic by construction: each package's preload points every service
      # variable at port 1, so a test that opens a connection fails by name.
      - name: Run every unit suite
        run: bun run --filter '*' test

  integration:
    name: integration tests (real Postgres + Redis)
    runs-on: ubuntu-latest
    env:
      # Ephemeral containers on the runner, thrown away with the job. The
      # database NAME carries the `test` marker the operator guard demands, and
      # the Redis gets the disposable marker key below — the two locks that keep
      # this suite from ever running against something that matters.
      DATABASE_URL: postgres://fretik:fretik@127.0.0.1:5432/fretik_test
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-
      - run: bun install --frozen-lockfile

      # Built rather than pulled: the migrations need postgis AND pgvector, and
      # no public image ships both. `services:` cannot build, hence `docker run`.
      - name: Start Postgres
        run: |
          docker build -t fretik-ci-postgres .github/postgres
          docker run -d --name ci-postgres \
            -e POSTGRES_USER=fretik \
            -e POSTGRES_PASSWORD=fretik \
            -e POSTGRES_DB=fretik_test \
            -p 5432:5432 fretik-ci-postgres
          for _ in $(seq 1 60); do
            docker exec ci-postgres pg_isready -U fretik -d fretik_test && exit 0
            sleep 1
          done
          echo "::error::Postgres never became ready"
          docker logs ci-postgres
          exit 1

      - name: Start Redis
        run: |
          docker run -d --name ci-redis -p 6379:6379 redis:8-alpine
          for _ in $(seq 1 30); do
            docker exec ci-redis redis-cli ping | grep -q PONG && break
            sleep 1
          done
          # The marker the integration guard demands. A Redis cannot report its
          # own name, so "may I wipe this?" is answered by a key an operator
          # sets deliberately — which production does not have and a tunnel
          # cannot forge.
          docker exec ci-redis redis-cli SET fretik:disposable \
            "ephemeral GitHub Actions container, discarded with the job"

      # THE check that would have caught the 2026-08-30 incident: every
      # migration has to apply to an EMPTY database, and the current code has to
      # pass on top of the result.
      - name: Apply all migrations from scratch
        run: bun run --filter '@fretik/shared' db:migrate

      - name: Nothing pending afterwards
        run: bun run --filter '@fretik/shared' db:status

      - name: Migrations are idempotent
        run: bun run --filter '@fretik/shared' db:migrate

      - name: Integration — @fretik/shared
        run: bun run --filter '@fretik/shared' test:integration

      - name: Integration — @fretik/ai
        run: bun run --filter '@fretik/ai' test:integration

      - name: Integration — @fretik/jobs
        run: bun run --filter '@fretik/jobs' test:integration

      - name: Postgres logs
        if: failure()
        run: docker logs ci-postgres

  # Advisory, never blocking: a flagged statement is sometimes exactly right,
  # and a gate nobody can override is a gate somebody removes.
  migration-safety:
    name: migration safety (advisory)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Look at the migrations this branch adds
        run: |
          git fetch --no-tags origin "${{ github.base_ref }}"
          bun run scripts/lint-migrations.ts "origin/${{ github.base_ref }}"

  build-and-push:
    name: build ${{ matrix.service }}
    needs: [changes, check, unit, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            changed: ${{ needs.changes.outputs.api }}
          - service: ai
            changed: ${{ needs.changes.outputs.ai }}
          - service: jobs
            changed: ${{ needs.changes.outputs.jobs }}
    steps:
      - uses: actions/checkout@v6
        if: matrix.changed == 'true'

      - uses: docker/setup-buildx-action@v4
        if: matrix.changed == 'true'

      - name: Login to GHCR
        if: matrix.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: meta
        if: matrix.changed == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/fretik-${{ matrix.service }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        if: matrix.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/${{ matrix.service }}/Dockerfile
          push: true
          # The commit this image IS, baked in. The release-task ledger runs
          # each task once per version, and this is the version — see
          # `services/release-tasks/runner.ts` for why it is not the
          # package.json number.
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: deploy ${{ matrix.service }}
    needs: [changes, build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      # Serial, not parallel: whichever service boots first applies the
      # migrations under the advisory lock and the others find nothing to do.
      # Any order works — but one at a time keeps the logs readable when a
      # migration is what actually failed.
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - service: api
            changed: ${{ needs.changes.outputs.api }}
            app_id: DOKPLOY_APP_ID_API
          - service: ai
            changed: ${{ needs.changes.outputs.ai }}
            app_id: DOKPLOY_APP_ID_AI
          - service: jobs
            changed: ${{ needs.changes.outputs.jobs }}
            app_id: DOKPLOY_APP_ID_JOBS
    steps:
      - name: Trigger Dokploy deploy
        if: matrix.changed == 'true'
        uses: benbristow/dokploy-deploy-action@0.2.2
        with:
          api_token: ${{ secrets.DOKPLOY_AUTH_TOKEN }}
          application_id: ${{ secrets[matrix.app_id] }}
          dokploy_url: ${{ secrets.DOKPLOY_URL }}
          service_type: application
