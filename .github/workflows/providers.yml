name: providers

on:
  push:
    branches: [main]
    paths:
      - "packages/providers/**"
      - "packages/shared/**"
      - "bun.lock"
      - "package.json"
      - ".github/workflows/providers.yml"
  pull_request:
    paths:
      - "packages/providers/**"
      - "packages/shared/**"
      - "bun.lock"
      - "package.json"

concurrency:
  group: providers-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"
  CI: "true"

jobs:
  check:
    name: typecheck + lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check @fretik/shared
        run: bun run --filter '@fretik/shared' check

      - name: Check @fretik/providers
        run: bun run --filter '@fretik/providers' check

      - name: Smoke import @fretik/providers (runs setProviders → Zod validates every manifest)
        run: bun run --filter '@fretik/providers' smoke
